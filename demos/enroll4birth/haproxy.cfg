global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http-in
    bind *:8080

    # route to a backend based on path's prefix
    use_backend osia_pr_servers if { path /pr } || { path_beg /pr/ }

backend osia_pr_servers
  # strip the prefix off of the path
  http-request replace-path /pr(/)?(.*) /\2
  server pr1 "pr:8080" maxconn 32
  # if mTLS
  # server pr1 "pr:8080" maxconn 32 ssl verify required ca-file /ha_CA/CA.pem crt /ha_CA/client-all.pem

# https://www.haproxy.com/blog/path-based-routing-with-haproxy
# https://www.haproxy.com/documentation/haproxy-configuration-tutorials/security/authentication/client-certificate-authentication/#send-a-client-certificate-to-servers
# https://www.haproxy.com/documentation/haproxy-configuration-tutorials/security/ssl-tls/basics-enable-tls/#server-side-tls

