---
BiographicData:
  type: object
  required:
    - firstName
    - lastName
    - dateOfBirth
    - gender
    - parentUIN
  properties:
    firstName:
      type: string
    lastName:
      type: string
    dateOfBirth:
      type: string
      format: date
    gender:
      type: string
      enum: ['M', 'F']
    parentUIN:
      type: string
  additionalProperties: false
ContextualData:
  type: object
  properties:
    enrollmentDate:
      type: string
      format: date-time
  additionalProperties: false
