global
    daemon
    maxconn 256
    # log stdout format raw local0 debug
    
defaults
    mode http
    # log global
    # option httplog
    # log-format "src=%ci:%cp fe=%ft be=%b src=%s ST=%ST Tq=%Tq Tw=%Tw Tc=%Tc Tr=%Tr Ta=%Ta term=%tsc bytes=%B req=\"%r\""
    timeout connect 10000ms
    timeout client 50000ms
    timeout server 50000ms


frontend http-in
    bind *:80

    # route to a backend based on path's prefix
    use_backend osia_notification_servers if { path /notification } || { path_beg /notification/ }
    use_backend osia_cr_servers if { path /cr } || { path_beg /cr/ }
    use_backend osia_pr_servers if { path /pr } || { path_beg /pr/ }
    use_backend osia_abis_servers if { path /abis } || { path_beg /abis/ }
    use_backend osia_cms_servers if { path /cms } || { path_beg /cms/ }

#
# Backends for Notification
#
backend osia_notification_servers
  # strip the prefix off of the path
  http-request replace-path /notification(/)?(.*) /\2
  http-request set-header Host localhost
  server osia ${OSIA_MOCK_HOSTNAME}:8040 maxconn 32

#
# Backends for Civil Registry
#
backend osia_cr_servers
  # strip the prefix off of the path
  http-request replace-path /cr(/)?(.*) /\2
  http-request set-header Host localhost
  server osia ${OSIA_MOCK_HOSTNAME}:8050 maxconn 32

backend digitech_cr_servers
  # strip the prefix off of the path
  http-request replace-path /cr(/)?(.*) /\2
  http-request set-header Host ${DIGITECH_HOSTNAME}
  server digitech ${DIGITECH_HOSTNAME}:80 maxconn 32

#
# Backends for Population Registry
#
backend osia_pr_servers
  # strip the prefix off of the path
  http-request replace-path /pr(/)?(.*) /\2
  http-request set-header Host localhost
  server osia ${OSIA_MOCK_HOSTNAME}:8010 maxconn 32

backend ingroupe_pr_servers
  # strip the prefix off of the path
  http-request replace-path /pr(/)?(.*) /\2
  http-request set-header Host ${INGROUPE_HOSTNAME}
  server ingroupe ${INGROUPE_HOSTNAME}:80 maxconn 32

backend xinfotech_pr_servers
  # strip the prefix off of the path
  http-request replace-path /pr(/)?(.*) /\2
  http-request set-header Host osia-population.osia-demo.azure.x-infotech.com
  server xinfotech osia-population.osia-demo.azure.x-infotech.com:443 maxconn 32 ssl verify none  sni str(osia-population.osia-demo.azure.x-infotech.com) crt /etc/haproxy/clt-xinfotech.pem

#
# Backends for Biometric Services
#
backend osia_abis_servers
  # strip the prefix off of the path
  http-request replace-path /abis(/)?(.*) /\2
  http-request set-header Host localhost
  server osia ${OSIA_MOCK_HOSTNAME}:8030 maxconn 32

backend xinfotech_abis_servers
  # strip the prefix off of the path
  http-request replace-path /abis(/)?(.*) /\2
  http-request set-header Host osia-biometric.osia-demo.azure.x-infotech.com
  server xinfotech osia-biometric.osia-demo.azure.x-infotech.com:443 maxconn 32 ssl verify none  sni str(osia-biometric.osia-demo.azure.x-infotech.com) crt /etc/haproxy/clt-xinfotech.pem

backend thales_abis_servers
  # strip the prefix off of the path
  http-request replace-path /abis(/)?(.*) /\2
  http-request add-header X-API-Key %[env(THALES_API_KEY)]
  http-request set-header Host trustech.dev.citizen-online.com
  server thales trustech.dev.citizen-online.com:443 maxconn 32 ssl verify none sni str(trustech.dev.citizen-online.com)

#
# Backends for CMS
#
backend osia_cms_servers
  # strip the prefix off of the path
  http-request replace-path /cms(/)?(.*) /\2
  http-request set-header Host localhost
  server osia ${OSIA_MOCK_HOSTNAME}:8060 maxconn 32

backend muehlbauer_cms_servers
  # strip the prefix off of the path
  http-request replace-path /cms(/)?(.*) /\2
  http-request set-header Host ${MUEHLBAUER_HOSTNAME}
  server digitech ${MUEHLBAUER_HOSTNAME}:80 maxconn 32

