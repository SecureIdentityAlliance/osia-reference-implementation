---
# [---CUSTO---]
BiographicData:
  type: object
  required:
    - firstName
    - lastName
  properties:
    firstName:
      type: string
    lastName:
      type: string
    dateOfBirth:
      type: string
      format: date
    gender:
      type: string
      enum: ['M', 'F']
    nationality:
      type: string
      enum:
        - FRA
        - USA
      default: USA
    # test all possible types
    fByte:
      type: string
      format: byte
    fBoolean:
      type: boolean
    fInteger32:
      type: integer
      format: int32
    fInteger64:
      type: integer
      format: int64
    fNumberFloat:
      type: number
      format: float
    fNumberDouble:
      type: number
      format: double
  additionalProperties: false
ContextualData:
  type: object
  properties:
    enrollmentOperator:
      type: string
    enrollmentDate:
      type: string
      format: date-time
    enrollmentDevice:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        brand:
          type: string
  additionalProperties: false
RequestData:
  type: object
  required:
    - requestType
  properties:
    requestType:
      type: string
EnrollmentFlags:
  type: object
  properties:
    timeout:
      type: integer
      format: int32
# [---CUSTO---]