services:
  portal:
    build:
      context: .
    volumes:
      - ${PWD}/src:/opt/portal/src
    ports:
      - "9500:8080"
    environment:
      - ENROLLMENT_URL=http://host.docker.internal:8000/
      - ORCHESTRATOR_URL=http://host.docker.internal:8100/
      - NOTIFICATION_URL=http://host.docker.internal:8040/
      - UIN_URL=http://host.docker.internal:8020/
    extra_hosts:
      - "host.docker.internal:host-gateway"

