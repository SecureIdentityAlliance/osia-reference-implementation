[tox]
envlist = clean,py,mon,tls
# [---CUSTO---]
# [---CUSTO---]
    report

[testenv]
usedevelop = true
deps =
    coverage
    gevent
    pytest
    requests
# [---CUSTO---]
# [---CUSTO---]
setenv =
    CR_CONF_DIR=tests/conf


# [---CUSTO---]
# [---CUSTO---]
commands =
    coverage run -a --source=src -m pytest -s .

[testenv:tls]
setenv =
    CR_CONF_DIR=tests/conf
    CR_SERVER_CERTFILE=tests/TLS_CA/server.pem
    CR_SERVER_KEYFILE=tests/TLS_CA/server.key
    CR_SERVER_KEYFILE_PASSWORD=secret


# [---CUSTO---]
# [---CUSTO---]
commands =
    coverage run -a --source=src -m pytest -s tests/test_cr.py

[testenv:mon]
setenv =
    CR_MONITORING_PORT=9090


# [---CUSTO---]
# [---CUSTO---]
commands =
    coverage run -a --source src -m pytest -s tests/test_monitoring.py

[tool:pytest]
cache_dir=.tox/pytest-cache

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase

[testenv:report]
deps = coverage
skip_install = true
commands =
    coverage report
    coverage xml
    coverage html

# [---CUSTO---]
# [---CUSTO---]