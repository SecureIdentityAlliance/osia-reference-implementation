
[metadata]
name = abis
version = attr: abis.__version__
author = Olivier Heurtier
author_email = olivier.heurtier@secureidentityalliance.org
license = Apache 2.0
description = abis
long_description = file: README.md
classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent

[options]
test_suite = 
    tests
install_requires =
    configargparse
    aiohttp
    livemetrics[aiohttp]
    sqlalchemy
    marshmallow
    marshmallow-sqlalchemy
    psycopg2-binary
    asyncpg
    aiosqlite
    pyyaml
    jsonschema
    referencing
    # [---CUSTO---]
    # [---CUSTO---]
package_dir=
    =src
packages=find_namespace:
include_package_data = True

[options.packages.find]
where=src

[options.entry_points]
console_scripts =
    abis = abis.__main__:main
