[tox]
envlist = clean,py,mon,tls
# [---CUSTO---]
# [---CUSTO---]
    report

[testenv]
usedevelop = true
deps =
    coverage
    gevent
    pytest
    requests
# [---CUSTO---]
# [---CUSTO---]
setenv =
    ABIS_CONF_DIR=tests/conf
    SQLITE=1
    ABIS_CUSTO_FILENAME={work_dir}/../tests/custo.yaml
# [---CUSTO---]
# [---CUSTO---]
commands =
    coverage run -a --source=src -m pytest -s .

[testenv:tls]
setenv =
    ABIS_CONF_DIR=tests/conf
    ABIS_SERVER_CERTFILE=tests/TLS_CA/server.pem
    ABIS_SERVER_KEYFILE=tests/TLS_CA/server.key
    ABIS_SERVER_KEYFILE_PASSWORD=secret
    SQLITE=1
    ABIS_CUSTO_FILENAME={work_dir}/../tests/custo.yaml
# [---CUSTO---]
# [---CUSTO---]
commands =
    coverage run -a --source=src -m pytest -s tests/test_abis.py

[testenv:mon]
setenv =
    ABIS_MONITORING_PORT=9090
    SQLITE=1
    ABIS_CUSTO_FILENAME={work_dir}/../tests/custo.yaml
# [---CUSTO---]
# [---CUSTO---]
commands =
    coverage run -a --source src -m pytest -s tests/test_monitoring.py

[tool:pytest]
cache_dir=.tox/pytest-cache

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase

[testenv:report]
deps = coverage
skip_install = true
commands =
    coverage report
    coverage xml
    coverage html

# [---CUSTO---]
# [---CUSTO---]